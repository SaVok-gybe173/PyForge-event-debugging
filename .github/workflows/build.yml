name: Build APK

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest

    steps:
      - name: Clean p4a caches
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            python3-pip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev \
            openjdk-17-jdk libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython>=3.1.0"

      - name: Verify host Cython
        run: python -c "import Cython; print('Host Cython:', Cython.__version__)"
      - name: Build APK with Buildozer
        id: build
        continue-on-error: true
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          buildozer android debug > build.log 2>&1
          echo "exit code: $?"

      - name: Upload error logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK if success
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk